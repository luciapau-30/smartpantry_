<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Pantry - My Pantry</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen">

    <nav class="bg-gray-800 shadow-md border-b border-gray-700">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center space-x-8">
                    <div class="flex-shrink-0 flex items-center">
                        <span class="font-bold text-2xl text-purple-500">Smart Pantry</span>
                    </div>
                    
                    <div class="hidden sm:ml-8 sm:flex sm:space-x-8">
                        <a href="index.html" class="text-gray-400 hover:text-purple-400 inline-flex items-center px-1 pt-1 border-b-2 border-transparent hover:border-gray-500 text-sm font-medium transition">
                            Explore Recipes
                        </a>
                        <a href="pantry.html" class="text-white inline-flex items-center px-1 pt-1 border-b-2 border-purple-500 text-sm font-medium">
                            My Pantry
                        </a>
                        <a href="recipes.html" class="text-gray-400 hover:text-purple-400 inline-flex items-center px-1 pt-1 border-b-2 border-transparent hover:border-gray-500 text-sm font-medium transition">
                            My Recipes
                        </a>
                    </div>
                </div>

                <div class="hidden sm:ml-6 sm:flex sm:items-center">
                    <button id="loginBtn" onclick="toggleModal()" class="bg-purple-600 text-white px-4 py-2 rounded-md text-sm font-medium hover:bg-purple-700 transition shadow-lg">
                        Log In
                    </button>
                    <div id="userNav" class="hidden flex items-center space-x-3">
                        <span id="usernameDisplay" class="text-gray-300 text-sm font-medium"></span>
                        <button onclick="logout()" class="bg-gray-700 text-white px-4 py-2 rounded-md text-sm font-medium hover:bg-gray-600 transition">
                            Log Out
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-5">
        <div class="text-center pt-0">
            <h1 class="text-4xl font-bold text-white tracking-tight">My Pantry</h1>
            <p class="mt-4 text-gray-400">Manage your pantry items here!</p>

            <div class="mt-6 flex justify-center">
                <a href="add-item.html" class="inline-flex items-center bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-md text-sm font-medium shadow">Add Item</a>
            </div>
        </div>
    </main>

    <!-- Auth modal (login + register tabs) -->
    <div id="authModal" class="hidden fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-gray-800 border border-gray-700 w-full max-w-md rounded-xl shadow-2xl p-8 relative">

            <button onclick="closeModal()" class="absolute top-4 right-4 text-gray-400 hover:text-white transition">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            </button>

            <!-- Tabs -->
            <div class="flex border-b border-gray-700 mb-6">
                <button id="tabLogin" onclick="showLoginTab()" class="flex-1 py-2 text-sm font-medium border-b-2 border-purple-500 text-white transition">Sign In</button>
                <button id="tabRegister" onclick="showRegisterTab()" class="flex-1 py-2 text-sm font-medium border-b-2 border-transparent text-gray-400 transition">Create Account</button>
            </div>

            <p id="authError" class="hidden text-red-400 text-sm mb-4"></p>

            <!-- Login form -->
            <form id="loginForm" onsubmit="submitLogin(event)" class="space-y-5">
                <div>
                    <label class="block text-sm font-medium text-gray-400 mb-2">Email or Username</label>
                    <input id="loginIdentifier" type="text" required class="w-full bg-gray-900 border border-gray-700 rounded-lg py-3 px-4 text-white focus:outline-none focus:border-purple-500 transition">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-400 mb-2">Password</label>
                    <input id="loginPassword" type="password" required class="w-full bg-gray-900 border border-gray-700 rounded-lg py-3 px-4 text-white focus:outline-none focus:border-purple-500 transition">
                </div>
                <button type="submit" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-3 rounded-lg transition shadow-lg">Sign In</button>
                <p class="text-center text-gray-400 text-sm">No account? <button type="button" onclick="showRegisterTab()" class="text-purple-400 hover:underline">Create one</button></p>
            </form>

            <!-- Register form -->
            <form id="registerForm" onsubmit="submitRegister(event)" class="hidden space-y-5">
                <div>
                    <label class="block text-sm font-medium text-gray-400 mb-2">Username</label>
                    <input id="regUsername" type="text" required class="w-full bg-gray-900 border border-gray-700 rounded-lg py-3 px-4 text-white focus:outline-none focus:border-purple-500 transition">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-400 mb-2">Email</label>
                    <input id="regEmail" type="email" required class="w-full bg-gray-900 border border-gray-700 rounded-lg py-3 px-4 text-white focus:outline-none focus:border-purple-500 transition">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-400 mb-2">Password</label>
                    <input id="regPassword" type="password" required class="w-full bg-gray-900 border border-gray-700 rounded-lg py-3 px-4 text-white focus:outline-none focus:border-purple-500 transition">
                </div>
                <button type="submit" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-3 rounded-lg transition shadow-lg">Create Account</button>
                <p class="text-center text-gray-400 text-sm">Already have one? <button type="button" onclick="showLoginTab()" class="text-purple-400 hover:underline">Sign in</button></p>
            </form>
        </div>
    </div>

    <script src="auth.js"></script>
</body>
</html>
