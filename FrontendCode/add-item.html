<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Pantry - Add Item</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen">

    <nav class="bg-gray-800 shadow-md border-b border-gray-700">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center space-x-8">
                    <div class="flex-shrink-0 flex items-center">
                        <span class="font-bold text-2xl text-purple-500">Smart Pantry</span>
                    </div>
                    
                    <div class="hidden sm:ml-8 sm:flex sm:space-x-8">
                        <a href="index.html" class="text-gray-400 hover:text-purple-400 inline-flex items-center px-1 pt-1 border-b-2 border-transparent hover:border-gray-500 text-sm font-medium transition">
                            Explore Recipes
                        </a>
                        <a href="pantry.html" class="text-gray-400 hover:text-purple-400 inline-flex items-center px-1 pt-1 border-b-2 border-transparent hover:border-gray-500 text-sm font-medium transition">
                            My Pantry
                        </a>
                        <a href="recipes.html" class="text-gray-400 hover:text-purple-400 inline-flex items-center px-1 pt-1 border-b-2 border-transparent hover:border-gray-500 text-sm font-medium transition">
                            My Recipes
                        </a>
                    </div>
                </div>

                <div class="hidden sm:ml-6 sm:flex sm:items-center">
                    <button onclick="toggleModal()" class="bg-purple-600 text-white px-4 py-2 rounded-md text-sm font-medium hover:bg-purple-700 transition shadow-lg">
                        Log In
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-2xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
        <!-- Add Item modal shown on page load. Closing navigates back. -->
        <div id="addItemModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
            <div class="bg-gray-800 border border-gray-700 w-full max-w-md rounded-xl shadow-2xl p-8 relative">
                <button onclick="closeAddItemModal()" class="absolute top-4 right-4 text-gray-400 hover:text-white transition">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>

                <h2 class="text-3xl font-bold text-white mb-6 text-center">Add Item</h2>

                <form action="#" class="space-y-4">
                    <div class="relative">
                        <label class="block text-sm font-medium text-gray-400 mb-2">Item Name</label>
                        <input id="itemName" name="itemName" required aria-autocomplete="list" aria-controls="suggestions" autocomplete="off" class="w-full bg-gray-900 border border-gray-700 rounded-lg py-3 px-4 text-white focus:outline-none focus:border-purple-500 transition">
                        <div id="suggestions" class="absolute left-0 right-0 z-50 mt-1 w-full bg-gray-800 border border-gray-700 rounded-lg max-h-48 overflow-auto hidden text-white"></div>
                        <p id="itemError" class="hidden text-red-400 text-sm mt-2" role="alert">Please select an item from the list.</p>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-400 mb-2">Quantity</label>
                        <input type="number" name="quantity" min="1" value="1" required class="w-full bg-gray-900 border border-gray-700 rounded-lg py-3 px-4 text-white focus:outline-none focus:border-purple-500 transition">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-400 mb-2">Expiration Date</label>
                        <input type="date" name="expiration" class="w-full bg-gray-900 border border-gray-700 rounded-lg py-3 px-4 text-white focus:outline-none focus:border-purple-500 transition">
                    </div>

                    <div class="flex items-center space-x-4">
                        <button type="submit" class="bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded-lg transition shadow">Add Item</button>
                        <button type="button" onclick="closeAddItemModal()" class="text-gray-400 hover:text-white">Cancel</button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <!--Ui for the popup login (copied from other pages) -->
    <div id="loginModal" class="hidden fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-gray-800 border border-gray-700 w-full max-w-md rounded-xl shadow-2xl p-8 relative">
            
            <button onclick="toggleModal()" class="absolute top-4 right-4 text-gray-400 hover:text-white transition">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            </button>

            <h2 class="text-3xl font-bold text-white mb-6 text-center">Login</h2>

            <form action="#" class="space-y-6">
                <div>
                    <label class="block text-sm font-medium text-gray-400 mb-2">Email Address</label>
                    <input type="email" required class="w-full bg-gray-900 border border-gray-700 rounded-lg py-3 px-4 text-white focus:outline-none focus:border-purple-500 transition">
                </div>

                <div>
                    <div class="flex justify-between mb-2">
                        <label class="text-sm font-medium text-gray-400">Password</label>
                        <a href="#" class="text-xs text-purple-400 hover:text-purple-300">Forgot Password?</a>
                    </div>
                    <input type="password" required class="w-full bg-gray-900 border border-gray-700 rounded-lg py-3 px-4 text-white focus:outline-none focus:border-purple-500 transition">
                </div>

                <button type="submit" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-3 rounded-lg transition shadow-lg">
                    Sign In
                </button>

                <p class="text-center text-gray-400 text-sm">
                    Don't have an account? <a href="#" class="text-purple-400 hover:underline">Sign up</a>
                </p>
            </form>
        </div>
    </div>

    <script>
        function toggleModal() {
            const modal = document.getElementById('loginModal');
            modal.classList.toggle('hidden');
        }

        function closeAddItemModal() {
            const modal = document.getElementById('addItemModal');
            if (modal) {
                // hide first for a cleaner transition then go back
                modal.classList.add('hidden');
            }
            // navigate back to previous page (pantry)
            if (window.history.length > 1) {
                window.history.back();
            } else {
                window.location.href = 'pantry.html';
            }
        }

        // Close popup if user clicks outside the box for both modals
        window.onclick = function(event) {
            const loginModal = document.getElementById('loginModal');
            if (loginModal && event.target == loginModal) {
                toggleModal();
            }
            const addModal = document.getElementById('addItemModal');
            if (addModal && event.target == addModal) {
                closeAddItemModal();
            }
        }

        // Populate suggestion dropdown from mock DB and filter as user types
        document.addEventListener('DOMContentLoaded', function(){
            const itemInput = document.getElementById('itemName');
            if (!itemInput) return;
            let items = [];
            // Test items until we can fetch from the mock DB; this would be an API call to the backend
            const INLINE_ITEMS = [
                "Eggs","Milk","Butter","Flour","Sugar","Salt","Olive Oil","Tomatoes","Onions","Garlic","Cheese","Yogurt","Chicken","Beef","Pasta","Rice","Bread","Coffee","Tea","Honey","Lemon","Potato","Carrot","Bell Pepper","Cucumber","Spinach","Apple","Banana","Orange","Mushrooms"
            ];

            items = INLINE_ITEMS.slice();

            // floating suggestions appended to document.body to avoid modal stacking/overflow issues
            const floating = document.createElement('div');
            floating.className = 'bg-gray-800 border border-gray-700 rounded-lg max-h-48 overflow-auto text-white';
            floating.style.position = 'absolute';
            floating.style.boxSizing = 'border-box';
            floating.style.minWidth = '120px';
            floating.style.maxWidth = '600px';
            floating.style.padding = '2px';
            floating.style.zIndex = '9999';
            floating.style.display = 'none';
            floating.style.pointerEvents = 'auto';
            document.body.appendChild(floating);

            function setPos() {
                const rect = itemInput.getBoundingClientRect();
                floating.style.left = (rect.left + window.scrollX) + 'px';
                floating.style.top = (rect.bottom + window.scrollY) + 'px';
                floating.style.width = rect.width + 'px';
            }
            window.addEventListener('resize', setPos);
            window.addEventListener('scroll', setPos, true);

            function render(list) {
                floating.innerHTML = '';
                if (!list || !list.length) {
                    floating.style.display = 'none';
                    return;
                }
                floating.style.display = 'block';
                list.forEach((it) => {
                    const row = document.createElement('div');
                    row.className = 'px-3 py-2 cursor-pointer hover:bg-gray-700';
                    row.textContent = it;
                    row.addEventListener('mousedown', (ev) => {
                        ev.preventDefault();
                        itemInput.value = it;
                        floating.style.display = 'none';
                        itemInput.focus();
                    });
                    floating.appendChild(row);
                });
            }

            // try to fetch and override inline items when served
            fetch('items-mock-db.txt').then(r => r.text()).then(t => {
                const fetched = t.split(/\r?\n/).map(s => s.trim()).filter(Boolean);
                // filter out lines that look like HTML or other junk
                const plausible = fetched.filter(line => {
                    // allow letters, numbers, spaces and common punctuation in item names
                    return /^[\w\s\-\&\.,']{1,80}$/.test(line);
                });
                if (plausible.length) {
                    items = plausible;
                } else {
                    // fetched content looks like HTML or invalid; keep inline items
                    console.warn('Fetched items file contained no plausible items; using inline list');
                }
                // don't render immediately; wait for user focus or typing
                setPos();
            }).catch(() => {
                // ignore errors and use inline items; do not render yet
                setPos();
            });

            let selected = -1;
            itemInput.addEventListener('input', (e) => {
                const errorEl = document.getElementById('itemError');
                if (errorEl) errorEl.classList.add('hidden');
                const q = e.target.value.toLowerCase();
                if (!q) {
                    floating.style.display = 'none';
                    return;
                }
                const filtered = items.filter(it => it.toLowerCase().includes(q)).slice(0, 50);
                setPos();
                render(filtered);
                selected = -1;
            });

            itemInput.addEventListener('keydown', (e) => {
                const children = Array.from(floating.children);
                if (e.key === 'ArrowDown') {
                    e.preventDefault();
                    if (!children.length) return;
                    selected = (selected + 1) % children.length;
                    children.forEach((c, i) => c.classList.toggle('bg-gray-700', i === selected));
                    children[selected].scrollIntoView({block: 'nearest'});
                } else if (e.key === 'ArrowUp') {
                    e.preventDefault();
                    if (!children.length) return;
                    selected = (selected - 1 + children.length) % children.length;
                    children.forEach((c, i) => c.classList.toggle('bg-gray-700', i === selected));
                    children[selected].scrollIntoView({block: 'nearest'});
                } else if (e.key === 'Enter') {
                    if (selected >= 0 && children[selected]) {
                        e.preventDefault();
                        itemInput.value = children[selected].textContent;
                        floating.style.display = 'none';
                        itemInput.focus();
                    }
                } else if (e.key === 'Escape') {
                    floating.style.display = 'none';
                }
            });

            itemInput.addEventListener('blur', () => setTimeout(() => floating.style.display = 'none', 150));
            itemInput.addEventListener('focus', () => {
                setPos();
                const q = itemInput.value.toLowerCase();
                if (!q) { // only show suggestions on focus if there's already input
                    floating.style.display = 'none';
                    return;
                }
                const filtered = items.filter(it => it.toLowerCase().includes(q)).slice(0, 50);
                render(filtered);
            });

            // Close and navigate back on form submit, but require selecting an item from the list
            const addItemForm = document.querySelector('form');
            const itemErrorEl = document.getElementById('itemError');
            if (addItemForm) {
                addItemForm.addEventListener('submit', function(e){
                    e.preventDefault();
                    const val = itemInput.value.trim();
                    const ok = items.some(it => it.toLowerCase() === val.toLowerCase());
                    if (!ok) {
                        if (itemErrorEl) {
                            itemErrorEl.textContent = 'Please select an item from the list.';
                            itemErrorEl.classList.remove('hidden');
                        }
                        itemInput.focus();
                        return;
                    }
                    if (itemErrorEl) itemErrorEl.classList.add('hidden');
                    // TODO: submit to backend here when available
                    closeAddItemModal();
                });
            }
        });
    </script>
</body>
</html>
